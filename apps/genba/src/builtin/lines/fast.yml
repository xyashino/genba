name: fast
description: Direct build with deterministic quality gate and delivery

operators:
  builder:
    profile: builder
    runner: claude
    model: haiku
    timeout: 60m
    permission: write

mechanic:
  profile: mechanic
  runner: claude
  model: sonnet
  timeout: 20m
  permission: read

stations:
  - id: build
    kind: operator
    operator: builder
    inputs: []

  - id: quality-gate
    kind: inspection
    timeout: 30m
    exec: []
    onFail:
      retry: build
      max: 3

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
  requireAdr: false
